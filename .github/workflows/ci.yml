name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build native libclips.so
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          make -C native/clips
          test -f native/clips/build/native/linux-x64/libclips.so

      - name: Test
        run: dotnet test ManagedDotNet.CLIPS.sln -c Release --verbosity normal

      - name: Upload linux native
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: native/clips/build/native/linux-x64/libclips.so
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Build native clips.dll
        shell: pwsh
        run: |
          cmake -S native/clips -B native/clips/build -A x64
          cmake --build native/clips/build --config Release
          New-Item -ItemType Directory -Force -Path native/clips/build/native/win-x64 | Out-Null
          $dll = Get-ChildItem -Path native/clips/build -Recurse -Filter clips.dll | Select-Object -First 1
          if (-not $dll) { throw "clips.dll not found" }
          Copy-Item $dll.FullName native/clips/build/native/win-x64/clips.dll -Force

      - name: Test
        run: dotnet test ManagedDotNet.CLIPS.sln -c Release --verbosity normal

      - name: Upload windows native
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: native/clips/build/native/win-x64/clips.dll
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: native/clips/build/native/linux-x64

      - name: Download windows native
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: native/clips/build/native/win-x64

      - name: Verify natives
        run: |
          test -f native/clips/build/native/linux-x64/libclips.so
          test -f native/clips/build/native/win-x64/clips.dll

      - name: Pack
        run: |
          dotnet pack src/CLIPS.csproj -c Release -p:GeneratePackageOnBuild=false
          ls -la src/nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "src/nupkgs/*.nupkg" \
            --source "https://nuget.pkg.github.com/FarazLabs/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
